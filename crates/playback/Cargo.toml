[package]
name = "soundcraft-playback"
description = "SoundCraft audio device I/O: realtime playback and recording through the mix engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
soundcraft-time.workspace = true
soundcraft-audio-io.workspace = true
soundcraft-model.workspace = true
soundcraft-mix.workspace = true
soundcraft-dsp.workspace = true
log.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }

[target.'cfg(windows)'.dependencies]
soundcraft-asio = { workspace = true, optional = true }

[features]
# ASIO on Windows: SoundCraft's native host (`soundcraft-asio`), which needs no Steinberg SDK and no
# LLVM. Off by default; `cargo build -p soundcraft --features asio`.
asio = ["dep:soundcraft-asio"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
